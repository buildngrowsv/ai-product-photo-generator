<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background — deep dark matching the premium product photo aesthetic -->
  <rect width="1200" height="630" fill="#030712"/>

  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle indigo/violet glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Camera icon — product photography motif -->
  <rect x="572" y="210" width="56" height="40" rx="6" stroke="url(#brandGradient)" stroke-width="2.5" fill="none"/>
  <circle cx="600" cy="230" r="10" stroke="url(#brandGradient)" stroke-width="2" fill="none"/>
  <rect x="590" y="205" width="20" height="8" rx="3" stroke="url(#brandGradient)" stroke-width="1.5" fill="none"/>

  <!-- Brand name -->
  <text x="600" y="330" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="url(#brandGradient)">PhotoForge AI</text>

  <!-- Tagline -->
  <text x="600" y="385" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8">AI Product Photos — Pro E-Commerce Images in Seconds</text>

  <!-- CTA pill -->
  <rect x="420" y="415" width="360" height="50" rx="25" fill="url(#brandGradient)"/>
  <text x="600" y="447" text-anchor="middle" fill="white" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
    Try it free — No sign-up needed
  </text>
</svg>
